name: AfroRhythm Engine Pipeline

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          PYTHONPATH=. pytest -v

      - name: Execute Signal Engine & Telemetry Pipeline
        run: |
          PYTHONPATH=. python3 src/stem_generator.py
          PYTHONPATH=. python3 src/audio_processor.py
          PYTHONPATH=. python3 src/agent.py
          PYTHONPATH=. python3 src/visualize.py

      - name: Sync Stems for GitHub Pages
        run: |
          mkdir -p docs/stems
          cp data/stems/*.wav docs/stems/

      - name: Commit and Push Updated Telemetry & Stems
        run: |
          git config --global user.name "jamesruga"
          git config --global user.email "jamesruga07@gmail.com"
          git add docs/
          git status
          git diff-index --quiet HEAD || (git commit -m "chore(ci): update audio stems and telemetry reports [skip ci]" && git push)
