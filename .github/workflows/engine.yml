name: AfroRhythm Engine Pipeline

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          python -m pytest -v

      - name: Run AfroRhythm Engine
        run: |
          python src/main.py

      - name: Commit and Push Visual & Web Audio Assets
        run: |
          git config --global user.name "jamesruga"
          git config --global user.email "jamesruga07@gmail.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(engine): update rhythmic DSP analytics [skip ci]" && git push)
